<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      if (
        window.location.hostname === 'musiclub-albums.vercel.app' ||
        window.location.hostname === 'musiclub.org'
      ) {
        window.location.replace(
          'https://www.musiclub.org' +
            window.location.pathname +
            window.location.search +
            window.location.hash
        );
      }
    </script>
    <meta
      name="description"
      content="Descubre, califica y reseña álbumes, EPs y canciones en Musiclub. Únete a la comunidad de melómanos para explorar rankings globales, recomendaciones personalizadas, análisis detallados pista por pista y el pool musical semanal."
    />
    <meta
      name="keywords"
      content="musica, albumes, reviews, calificaciones, club de musica, reseñas musicales, spotify, musicbrainz, canciones, rankings, discografia"
    />
    <meta name="theme-color" content="#0c0d1e" />
    <meta
      name="google-site-verification"
      content="0pLiSU5HTFvlbKZcVEg8qnt2O6lQsCFt-t5IFgTlwK8"
    />
    <link rel="icon" href="%PUBLIC_URL%/musiclub_logo_corchea.png" />
    <title>Musiclub - Reviews From & For Music Lovers</title>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.musiclub.org" />
    <meta property="og:site_name" content="Musiclub" />
    <meta
      property="og:title"
      content="Musiclub - Reviews From & For Music Lovers"
    />

      property="og:description"
      content="Descubre, califica y reseña álbumes, EPs y canciones en Musiclub. Únete a la comunidad de melómanos para explorar rankings globales, recomendaciones personalizadas y el pool musical semanal."

    <meta
      property="og:image"
      content="https://www.musiclub.org/musiclub_logo_corchea.png"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:title"
      content="Musiclub - Reviews From & For Music Lovers"

      content="Descubre, califica y reseña álbumes, EPs y canciones en Musiclub. Únete a la comunidad de melómanos para explorar rankings globales y recomendaciones personalizadas."
    />
    <meta
      name="twitter:image"
      content="https://www.musiclub.org/musiclub_logo_corchea.png"
    />

    <!-- Web Fonts (Figtree optimizado con display=swap) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"

    ></script>
