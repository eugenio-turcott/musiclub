name: Refresh official artist discographies
on:
  schedule:
    - cron: '15 8 * * *'
  workflow_dispatch:
    inputs:
      artist_slugs:
        description: 'Opcional: slugs separados por coma; vacío actualiza artistas del club pendientes'
        required: false
        type: string
      repair_only:
        description: 'Solo reparar metadatos y duplicados de las discografías guardadas'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: official-artist-discographies
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Repair incomplete stored metadata
        env:
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ARTIST_SLUGS: ${{ inputs.artist_slugs }}
        run: node scripts/repair-artist-metadata.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artist-metadata-report
          path: artist-metadata-report.json
          retention-days: 7
      - name: Refresh stored official discographies
        if: ${{ !inputs.repair_only }}
        env:
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REACT_APP_SPOTIFY_CLIENT_ID: ${{ secrets.REACT_APP_SPOTIFY_CLIENT_ID }}
          REACT_APP_SPOTIFY_CLIENT_SECRET: ${{ secrets.REACT_APP_SPOTIFY_CLIENT_SECRET }}
          ARTIST_SLUGS: ${{ inputs.artist_slugs }}
        run: node scripts/refresh-artist-discographies.mjs
