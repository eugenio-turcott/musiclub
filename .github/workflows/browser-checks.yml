name: Musiclub browser navigation checks
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: browser-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The hosted image already contains Chrome and its system dependencies.
      - run: google-chrome --version
      - run: npm run test:browser
        env:
          PLAYWRIGHT_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-navigation-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
