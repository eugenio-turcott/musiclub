name: Musiclub browser navigation checks
on:
  push:
    branches: [master]
    paths: ['src/**','public/**','tests/**','package*.json','*.config.*','wrangler.jsonc','scripts/build-cloudflare.mjs','scripts/verify-cloudflare-build.mjs','.github/workflows/browser-checks.yml']
  pull_request:
    paths: ['src/**','public/**','tests/**','package*.json','*.config.*','wrangler.jsonc','scripts/build-cloudflare.mjs','scripts/verify-cloudflare-build.mjs','.github/workflows/browser-checks.yml']
permissions:
  contents: read
concurrency:
  group: browser-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The hosted image already contains Chrome and its system dependencies.
      - run: google-chrome --version
      - run: npm run test:browser -- --project=${{ matrix.device }}
        env:
          PLAYWRIGHT_CHANNEL: chrome
          PLAYWRIGHT_CLOUDFLARE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-navigation-report-${{ matrix.device }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
