name: Daily Record Club Sync & Trending Update

on:
  schedule:
    # Ejecutar todos los días a las 04:00 AM UTC (Control de idempotencia diaria)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forzar sincronización ignorando caché diario'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync-record-club:
    name: Sync Record Club Releases & Update Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Daily Record Club Sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
          REACT_APP_SPOTIFY_CLIENT_ID: ${{ secrets.REACT_APP_SPOTIFY_CLIENT_ID }}
          REACT_APP_SPOTIFY_CLIENT_SECRET: ${{ secrets.REACT_APP_SPOTIFY_CLIENT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          REPLY_TO: ${{ secrets.REPLY_TO }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            node scripts/dailyRecordClubSync.mjs --force
          else
            node scripts/dailyRecordClubSync.mjs
          fi
