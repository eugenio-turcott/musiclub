name: Update verified genres and their visual identities
on:
  schedule:
    - cron: '35 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: musiclub-genre-registry
  cancel-in-progress: false
jobs:
  refresh:
    # Enable only after applying and verifying the one-time database migration.
    if: vars.MUSICLUB_GENRE_REGISTRY_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Fetch verified MusicBrainz genres
        run: node scripts/update-genre-registry.mjs
      - name: Validate genre identities and artwork
        run: npm run test:critical
      - name: Synchronize the database whitelist
        env:
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-genre-registry.mjs
      - name: Publish registry additions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add src/data/musicGenres.json src/data/musicbrainzGenreIds.json
          if git diff --cached --quiet; then exit 0; fi
          npm version patch --no-git-tag-version
          git add package.json package-lock.json
          version=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Musiclub Updates - V.$version"
          git push origin HEAD:master
