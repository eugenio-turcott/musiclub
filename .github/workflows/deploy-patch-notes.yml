name: Verify published patch notes
on:
  push:
    branches: [master]
    paths: ['src/data/patchNotesData.js']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public patch notes after deployment
        run: curl --fail --retry 5 --retry-delay 20 --retry-all-errors --silent --show-error --output /dev/null https://www.musiclub.org/patch-notes
