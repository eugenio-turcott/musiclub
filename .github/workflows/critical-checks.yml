name: Musiclub critical checks
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:critical
      - run: npm audit --audit-level=moderate
      - run: node --check scripts/dailyRecordClubSync.mjs
      - run: node --check scripts/checkUpcomingReleasesCron.mjs
