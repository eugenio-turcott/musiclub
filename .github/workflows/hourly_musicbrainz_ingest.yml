name: Smart Catalog Ingestion (65% 2026 / 20% Tendencia / 15% Décadas) & Sitemap Update

on:
  schedule:
    # Se ejecuta automáticamente cada 30 minutos (48 veces al día)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permite ejecución manual con selector de cantidad desde GitHub Actions
    inputs:
      target:
        description: 'Cantidad de álbumes a sembrar (ej. 50, 100)'
        required: false
        default: '50'

permissions:
  contents: write # Permiso necesario para commitear el sitemap.xml y seeder_state.json

jobs:
  ingest-and-update-sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Smart Catalog Seeder (65% 2026 / 20% Tendencia / 15% Décadas) & Update Sitemap
        env:
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
          REACT_APP_SPOTIFY_CLIENT_ID: ${{ secrets.REACT_APP_SPOTIFY_CLIENT_ID }}
          REACT_APP_SPOTIFY_CLIENT_SECRET: ${{ secrets.REACT_APP_SPOTIFY_CLIENT_SECRET }}
        run: node scripts/smartCatalogSeeder.mjs --target=${{ github.event.inputs.target || '50' }} --sitemap

      - name: Commit & Push updated Sitemap and Seeder State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/seeder_state.json public/sitemap*.xml
          if git diff --staged --quiet; then
            echo "Sin cambios para commitear."
          else
            git commit -m "chore: automated smart catalog ingestion and sitemap update [skip ci]"
            git push
          fi

      - name: Ping Search Engines for Sitemap Indexing
        run: |
          echo "Notificando a motores de búsqueda sobre el nuevo sitemap..."
          curl -s "https://www.bing.com/ping?sitemap=https://www.musiclub.org/sitemap.xml" || true
          echo "Motores de búsqueda notificados con éxito."
